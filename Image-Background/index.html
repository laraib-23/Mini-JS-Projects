<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background-Change</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="img-box" id="imgBox">
            <!-- Transparent / Base Image -->
            <img src="images/transparent.png" class="transparent-img">
            <!-- Wrapper for Top (Original) Image -->
            <div class="img-wrap" id="imgWrap">
                <img src="images/original.jpg" id="originalImg">
            </div>
            <!-- Slider Line and Arrow Handle -->
            <span id="line">
                <img src="images/arrow.png" class="arrow">
            </span>
        </div>
    </div>

    <script>
        var imgBox = document.getElementById("imgBox");
        var imgWrap = document.getElementById("imgWrap");
        var originalImg = document.getElementById("originalImg");
        var line = document.getElementById("line");
        // Set top image width equal to parent container so it doesn't compress
        originalImg.style.width = imgBox.offsetWidth + "px";
        // Track cursor movement across the image box
        imgBox.onmousemove = function(e) {
            var leftSpace = imgBox.offsetLeft;
            var boxWidth = (e.pageX - leftSpace) + "px";
            imgWrap.style.width = boxWidth;
            line.style.left = boxWidth;
        }
    </script>
</body>
</html>
